<style>
*{
    box-sizing:border-box;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("Screenshot__313_.png");
    background-repeat:repeat;
    background-size:140px;
    opacity:0.16;
    pointer-events:none;
    z-index:0;
}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px; letter-spacing:0.2px;
   
        background:
    radial-gradient(circle at 20% 20%, #fffaf5, transparent 30%),
    radial-gradient(circle at 80% 30%, #ead1ca, transparent 25%),
    radial-gradient(circle at 20% 85%, #e8d0c2, transparent 30%),
    #f3e5d8;
    font-family:Georgia,serif;
    color:#5b4035;
    overflow:auto; background-attachment:fixed;
}

.card{
    position:relative;
    width:90%;
    max-width:700px;
    min-height:500px;
    padding:60px 42px;
    text-align:center;
    background:
       
    repeating-linear-gradient(
        0deg,
        #fffaf4 0px,
        #fffaf4 3px,
        #fdf5ed 4px,
        #fffaf4 7px
    );
   border:1px solid #d8b8aa; border-radius:28px; background-size:100% 8px;
    box-shadow:
        0 20px 55px rgba(90,55,40,0.16),
        0 4px 12px rgba(90,55,40,0.08);
}

.card::before{
   
    content:"🎀  ♡  ✿  ♡  🎀";
    position:absolute;
    top:18px;
    left:0;
    right:0;
    font-size:18px;
    letter-spacing:12px;
    color:#b98778;
}
}

.card::after{
    content:"♡";    position:absolute;
    bottom:18px;
    right:25px;
    font-size:25px;
    color:#c49687;
}

.decor{
    font-size:22px;
    margin-bottom:18px;
    letter-spacing:3px;
    opacity:0.9;
}
.corner-decor{
    position:absolute;
    font-size:24px;
    opacity:0.6;
}
.tape{
    position:absolute;
    width:90px;
    height:24px;
    background:rgba(221,190,176,0.55);
    transform:rotate(-7deg);
    opacity:0.8;
}
.corner-left{
    left:18px;
    bottom:20px;
}

.corner-right{
    right:18px;
    top:55px;
}  

h1{
    font-size:45px;
    margin:10px 0 20px;
    color:#6b4639;
    font-weight:normal;
    letter-spacing:2px;text-shadow:2px 2px 0px #ead4c8;
}

h2{
    font-size:31px;
    color:#704b3e;
    font-weight:normal;
}

p{
    font-size:19px;
    line-height:1.9;
    color:#654b41;
}

button{
    border:1px solid #d2aaa0;
    padding:14px 30px;
    margin:10px;
    border-radius:18px;
    font-family:Georgia,serif;
    font-size:16px;
    cursor:pointer;
    background:#a97868;    color:white;
    box-shadow:
    0 5px 10px rgba(90,55,40,0.12),
    2px 2px 0px rgba(185,135,120,0.18); filter:sepia(3%);
    transition:0.25s;
}

button:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 9px 20px rgba(90,55,40,0.2);
}

.photo{
    width:85%;
    max-width:450px;
    border-radius:20px;
    margin:15px;
    box-shadow:0 10px 25px rgba(70,45,35,0.15);
}

.photo-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:24px; padding:10px 4px;
}

.photo-grid img{
    width:42%;
    max-width:250px;
    border-radius:4px;
    padding:8px 8px 28px 8px;
    background:#fffaf4;
    box-shadow:
    0 10px 18px rgba(70,45,35,0.16),
    2px 4px 0px rgba(185,135,120,0.12);    transform:rotate(-2deg); transition:transform 0.3s ease;
} .photo-grid img:nth-child(even){
    transform:rotate(2deg);
} .photo-grid img:hover{
    transform:rotate(0deg) scale(1.04);
} @media(max-width:600px){
